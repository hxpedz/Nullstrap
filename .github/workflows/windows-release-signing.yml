name: Windows release signing
run-name: Sign Nullstrap ${{ inputs.version }} ${{ inputs.request-id }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact origin/main commit to build and sign
        required: true
        type: string
      version:
        description: Four-part Nullstrap version
        required: true
        type: string
      request-id:
        description: Unique request identifier supplied by publish-all.ps1
        required: true
        type: string

concurrency:
  group: windows-release-signing-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hxpedz/Nullstrap' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.validate.outputs.version }}
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      REQUEST_ID: ${{ inputs.request-id }}
    steps:
      - name: Validate requested source and version
        id: validate
        shell: pwsh
        run: |
          if ($env:RELEASE_COMMIT -notmatch '\A[0-9a-f]{40}\z') {
            throw 'The requested source commit is invalid.'
          }
          if ($env:RELEASE_VERSION -notmatch '\A\d+\.\d+\.\d+\.\d+\z') {
            throw 'The release version must have four numeric components.'
          }
          if ($env:REQUEST_ID -notmatch '\A[0-9a-f]{32}\z') {
            throw 'The request identifier is invalid.'
          }
          $remoteMain = (git ls-remote https://github.com/hxpedz/Nullstrap.git refs/heads/main).Split("`t")[0]
          if ($LASTEXITCODE -ne 0 -or $remoteMain -cne $env:RELEASE_COMMIT) {
            throw 'The requested source is not the current main branch commit.'
          }
          "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Validate project version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = $props.SelectSingleNode('/Project/PropertyGroup/NullstrapVersion').InnerText
          if ($projectVersion -ne $env:RELEASE_VERSION) {
            throw "Release tag version does not match Directory.Build.props."
          }

      - name: Build and validate unsigned executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'nullstrap-publish'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'nullstrap-unsigned'
          dotnet publish src/Nullstrap.App/Nullstrap.csproj -c Release -r win-x64 --self-contained false "-p:Version=$env:RELEASE_VERSION" -p:PublishProfile=FolderProfile -p:PublishReadyToRun=false -p:IncludeAllContentForSelfExtract=false -p:PublishSingleFile=true -p:UseAppHost=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true -p:IncludeSourceRevisionInInformationalVersion=false -p:RestoreUseStaticGraphEvaluation=true -p:TreatWarningsAsErrors=true -p:EnableWindowsTargeting=true -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Nullstrap publish failed.' }

          $exe = Join-Path $publishDir 'Nullstrap.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Nullstrap.exe was not produced.' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductName -ne 'Nullstrap' -or $info.CompanyName -ne 'Nullstrap' -or $info.OriginalFilename -ne 'Nullstrap.dll' -or $info.ProductVersion -ne $env:RELEASE_VERSION -or $info.FileVersion -ne $env:RELEASE_VERSION) {
            throw "Unexpected Nullstrap metadata: ProductName='$($info.ProductName)', CompanyName='$($info.CompanyName)', OriginalFilename='$($info.OriginalFilename)', ProductVersion='$($info.ProductVersion)', FileVersion='$($info.FileVersion)'."
          }

          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $artifactDir 'Nullstrap.exe')

      - name: Upload unsigned executable
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nullstrap-windows-unsigned-${{ steps.validate.outputs.version }}
          path: ${{ runner.temp }}/nullstrap-unsigned/Nullstrap.exe
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    if: github.repository == 'hxpedz/Nullstrap' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: none
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Sign executable with SignPath test certificate
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ed77d7e3-732a-453f-9ba9-0c25de62f363
          project-slug: Nullstrap
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-release
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/nullstrap-signed

      - name: Verify signed executable metadata and signature
        id: verify
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'nullstrap-signed/Nullstrap.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'The signed Nullstrap.exe was not returned.' }

          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductName -ne 'Nullstrap' -or $info.ProductVersion -ne $env:RELEASE_VERSION -or $info.CompanyName -ne 'Nullstrap' -or $info.OriginalFilename -ne 'Nullstrap.dll' -or $info.FileVersion -ne $env:RELEASE_VERSION) {
            throw "Unexpected signed Nullstrap metadata: ProductName='$($info.ProductName)', CompanyName='$($info.CompanyName)', OriginalFilename='$($info.OriginalFilename)', ProductVersion='$($info.ProductVersion)', FileVersion='$($info.FileVersion)'."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($null -eq $signature.SignerCertificate) {
            throw "The signed executable has no Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }
          $pinnedTestCertificate = $signature.SignerCertificate.Thumbprint -eq '84913A32E5DBC03EDC416B4FD3B499DCBD52145E'
          if ($signature.Status -ne 'Valid' -and -not ($pinnedTestCertificate -and $signature.Status -in @('UnknownError', 'NotTrusted'))) {
            throw "The signed executable signature is not accepted: $($signature.Status) $($signature.StatusMessage) signer $($signature.SignerCertificate.Thumbprint)"
          }

      - name: Upload signed executable for manual publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nullstrap-windows-signed-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/nullstrap-signed/Nullstrap.exe
          if-no-files-found: error
          retention-days: 1

